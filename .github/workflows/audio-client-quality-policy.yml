name: Audio client-quality policy
on:
  pull_request:
    paths:
      - 'audio/maletin/client-quality-policy.js'
      - 'tests/maletin-client-quality-policy.test.cjs'
      - '.github/workflows/audio-client-quality-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated tests
        run: |
          node --check audio/maletin/client-quality-policy.js
          node --check tests/maletin-client-quality-policy.test.cjs
          node tests/maletin-client-quality-policy.test.cjs
