name: Unfire Audio moon and stationary spaceship QA
on:
  pull_request:
    paths:
      - 'audio/index.html'
      - 'audio/maletin/index.html'
      - 'audio/maletin/lunar-world.js'
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/audio-lunar-world.test.cjs'
      - 'tests/audio-lunar-browser.cjs'
      - '.github/workflows/audio-lunar-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moon-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check audio/maletin/lunar-world.js
          node --check audio/maletin/game-engine-v50.js
          node --test tests/audio-lunar-world.test.cjs tests/audio-companion-natural-and-hud.test.cjs tests/audio-nano-engine-connection.test.cjs tests/audio-case-hotfix-cache.test.cjs tests/expanded-map.test.cjs tests/offline-coins-mini-robot.test.cjs tests/unfire-conversations-20261024.test.cjs
  moon-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/audio-lunar-browser.cjs
