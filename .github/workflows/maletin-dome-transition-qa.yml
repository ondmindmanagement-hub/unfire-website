name: Maletin dome flight transition QA

on:
  pull_request:
    paths:
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/maletin-dome-transition.test.cjs'
      - 'tests/maletin-dome-browser.cjs'
      - '.github/workflows/maletin-dome-transition-qa.yml'
  push:
    branches: [main]
    paths:
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/maletin-dome-transition.test.cjs'
      - 'tests/maletin-dome-browser.cjs'
      - '.github/workflows/maletin-dome-transition-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dome-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check audio/maletin/game-engine-v50.js
      - name: Dome exit, re-entry and anti-bounce regression
        run: node --test tests/maletin-dome-transition.test.cjs
      - name: Preserve original maletin structural contracts
        run: node tests/maletin-v50.test.cjs

  dome-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real 3D roof exit and return (desktop and mobile viewports)
        run: node tests/maletin-dome-browser.cjs
