name: Unfire product microsites - static QA
on:
  pull_request:
    paths:
      - 'assets/css/unfire-microsites.css'
      - 'portable-synth/**'
      - 'games/y2k-robots/**'
      - 'games/index.html'
      - 'sitemap.xml'
      - 'tests/product-microsites.test.cjs'
      - 'tests/product-microsites-browser.cjs'
      - '.github/workflows/product-microsites-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check portable-synth/play/synth.js
      - name: Product structure, links, sitemap and privacy checks
        run: node --test tests/product-microsites.test.cjs

  browser-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser testing runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Chromium + WebKit desktop and mobile rendering, functional smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/unfire-microsites-http.log 2>&1 &
          echo $! > /tmp/unfire-microsites-http.pid
          trap 'kill $(cat /tmp/unfire-microsites-http.pid) || true' EXIT
          node tests/product-microsites-browser.cjs
      - name: Save screenshots for release review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microsites-browser-screenshots
          path: artifacts/product-microsites/*.png
          retention-days: 7
          if-no-files-found: ignore
