name: Audio Garage Scroll Guard
on:
  push:
    paths:
      - 'audio/maletin/garage-scroll-guard.js'
      - 'audio/maletin/index.html'
      - 'tests/audio-garage-scroll-guard.test.cjs'
      - '.github/workflows/audio-garage-scroll-guard.yml'
  pull_request:
    paths:
      - 'audio/maletin/garage-scroll-guard.js'
      - 'audio/maletin/index.html'
      - 'tests/audio-garage-scroll-guard.test.cjs'
      - '.github/workflows/audio-garage-scroll-guard.yml'
jobs:
  garage-input-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and garage interaction regression
        run: |
          node --check audio/maletin/garage-scroll-guard.js
          node --test tests/audio-garage-scroll-guard.test.cjs
