name: Hyperwave atelier audio and loading QA
on:
  pull_request:
    paths:
      - 'audio/hyperwave/index.html'
      - 'hyperwave-hardware/index.html'
      - 'assets/js/unfire-ember-20261123.js'
      - 'assets/css/unfire-ember-20261123.css'
      - 'index.html'
      - 'tests/unfire-home-overload.test.cjs'
      - '.github/workflows/hyperwave-atelier-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atelier-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate syntax and loading, audio unlock, responsive and resource guards
        run: |
          node --check assets/js/unfire-ember-20261123.js
          node --test tests/unfire-home-overload.test.cjs
