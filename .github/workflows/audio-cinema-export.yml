name: Unfire Audio native cinematic video export
on:
  pull_request:
    paths:
      - 'audio/maletin/cinema-export.js'
      - 'audio/maletin/game-engine-v50.js'
      - 'audio/maletin/index.html'
      - 'audio/index.html'
      - 'tests/audio-cinema-export.test.cjs'
      - '.github/workflows/audio-cinema-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check audio/maletin/cinema-export.js
          node --check audio/maletin/game-engine-v50.js
          node --test tests/audio-cinema-export.test.cjs tests/audio-lunar-world.test.cjs tests/audio-case-hotfix-cache.test.cjs tests/audio-nano-engine-connection.test.cjs
