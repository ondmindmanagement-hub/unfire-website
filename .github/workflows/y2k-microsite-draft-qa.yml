name: Y2K ROBOTS separate microsite draft gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'games/y2k-robots/**'
      - 'tests/y2k-microsite.test.cjs'
      - '.github/workflows/y2k-microsite-draft-qa.yml'
permissions:
  contents: read
jobs:
  static-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure independent project identity and fail-closed publication
        run: node --test tests/y2k-microsite.test.cjs
