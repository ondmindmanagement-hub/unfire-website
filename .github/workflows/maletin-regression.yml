name: Maletin case regression

on:
  pull_request:
    paths:
      - 'audio/index.html'
      - 'audio/img/maletin-real-first-frame-desktop.webp'
      - 'audio/img/maletin-real-first-frame-mobile.webp'
      - 'tests/maletin-first-paint.test.cjs'
      - 'tests/maletin-first-paint-browser.cjs'
      - 'audio/maletin/index.html'
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/maletin-v50.test.cjs'
      - 'tests/maletin-radio-volume.test.cjs'
      - 'tests/maletin-v50-browser.cjs'
      - 'tests/maletin-mobile-rotation.cjs'
      - 'tests/maletin-entry-fullscreen.cjs'
      - 'audio/game.webmanifest'
      - '.github/workflows/maletin-regression.yml'
  workflow_dispatch:

# New commits supersede their own outdated test run. No parallel WebGL
# instances: each heavyweight browser suite gets a fresh isolated runner.
concurrency:
  group: maletin-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, click routing, missions, audio and multiplayer preservation
        run: |
          node tests/maletin-v50.test.cjs
          node tests/maletin-first-paint.test.cjs
          node tests/maletin-radio-volume.test.cjs

  entry:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify first-tap immersive entry and Nimbo HUD layout
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/unfire-entry-http.log 2>&1 &
          sleep 2
          UNFIRE_ENTRY_URL=http://127.0.0.1:8767/audio/ node tests/maletin-first-paint-browser.cjs
          UNFIRE_ENTRY_URL=http://127.0.0.1:8767/audio/ node tests/maletin-entry-fullscreen.cjs

  mobile:
    needs: entry
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check portrait, landscape, touch and online menu without losing story progress
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unfire-mobile-http.log 2>&1 &
          sleep 2
          node tests/maletin-mobile-rotation.cjs

  browser:
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Exercise the game in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unfire-http.log 2>&1 &
          sleep 2
          node tests/maletin-v50-browser.cjs
