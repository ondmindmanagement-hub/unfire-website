name: Unfire multiplayer live QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unfire-multiplayer-qa
  cancel-in-progress: true
jobs:
  peerjs-two-players:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install free Chromium test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test a live hosted room with two browsers
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/unfire-p2p-http.log 2>&1 &
          sleep 2
          node tests/maletin-two-players-qa.cjs
