name: Hyperwave Mega audio curation
on:
  pull_request:
    paths:
      - 'audio/maletin/index.html'
      - 'audio/maletin/game-engine-v50.js'
      - 'audio/hyperwave/index.html'
      - 'audio/js/synthvoice.js'
      - 'audio/js/engines.js'
      - 'tests/maletin-hyperwave-mega-audio.test.cjs'
      - '.github/workflows/hyperwave-mega-audio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax of shared Hyperwave, plugins and game engine
        run: |
          node --check audio/maletin/game-engine-v50.js
          node --check audio/js/synthvoice.js
          node --check audio/js/engines.js
      - name: Audio mix and deterministic transposer contracts
        run: node tests/maletin-hyperwave-mega-audio.test.cjs
      - name: Existing radio and case regression contracts
        run: |
          node tests/maletin-radio-volume.test.cjs
          node tests/maletin-v50.test.cjs
