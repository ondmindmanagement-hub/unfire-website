name: Unfire global bar
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - '**/*.html'
      - 'assets/css/unfire-global-bar-20261122.css'
      - 'assets/data/unfire-products.json'
      - 'scripts/apply-global-bar.py'
      - 'scripts/build-ecosystem-pages.py'
      - 'tests/unfire-global-bar.test.cjs'
      - '.github/workflows/unfire-global-bar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-bar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Every public page carries the current bar
        run: python3 scripts/apply-global-bar.py --check
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Bar present once, in flow, uncovered, 7 items, compact menu, no overflow (390 and 1440)
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 > /tmp/unfire-bar-http.log 2>&1 &
          sleep 2
          node tests/unfire-global-bar.test.cjs
