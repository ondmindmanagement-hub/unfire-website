name: Archer Web public-source QA
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'apps/archer-web/**'
      - 'tests/archer-web-browser.cjs'
      - '.github/workflows/archer-web-ghpages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static page and local audio validation
        run: |
          node --check apps/archer-web/dsp.js
          node --check apps/archer-web/app.js
          node --check tests/archer-web-browser.cjs
          node --test apps/archer-web/dsp.test.cjs
          node - <<'NODE'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const h=fs.readFileSync("apps/archer-web/index.html","utf8");
          assert.match(h,/noindex,nofollow/);
          assert.match(h,/unfire\.technology\/apps\/archer-web/);
          assert.ok(h.includes("No uploads"));
          const app=fs.readFileSync("apps/archer-web/app.js","utf8");
          assert.ok(!/fetch\s*\(|XMLHttpRequest|sendBeacon|localStorage/.test(app));
          console.log("ARCHER_WEB_LOCAL_PRIVACY_PRECHECK_PASS");
          NODE
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Real browser audio and WAV export checks
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/archer-web-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node tests/archer-web-browser.cjs
      - name: Browser image captures with synthetic tone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-web-browser-captures
          path: artifacts/archer-web/*.png
          retention-days: 7
          if-no-files-found: ignore
