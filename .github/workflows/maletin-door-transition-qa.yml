name: Maletin door transition QA

on:
  pull_request:
    paths:
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/maletin-door-transition.test.cjs'
      - '.github/workflows/maletin-door-transition-qa.yml'
  push:
    branches: [main]
    paths:
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/maletin-door-transition.test.cjs'
      - '.github/workflows/maletin-door-transition-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  door-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exit and return without WebGL
        run: node --test tests/maletin-door-transition.test.cjs
