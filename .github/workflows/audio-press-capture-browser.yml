name: Audio Press Authentic Gameplay Captures
on:
  pull_request:
    paths:
      - 'audio/press/**'
      - 'tests/audio-press-capture-browser.cjs'
      - '.github/workflows/audio-press-capture-browser.yml'
permissions:
  contents: write
jobs:
  capture-real-gameplay:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser (GitHub runner, not user's Mac)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify screenshot inventory before heavy browser startup
        id: inventory
        run: |
          missing=0
          for name in 01-inside-house.jpg 02-house-interior.jpg 03-house-exterior.jpg 04-island-exploration.jpg; do
            asset="audio/press/captures/$name"
            if [ ! -s "$asset" ]; then
              missing=1
              break
            fi
            file -b "$asset" | grep -q 'JPEG image data' || exit 1
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - name: Capture real Three.js game world inside and outside
        if: steps.inventory.outputs.missing == '1'
        run: node tests/audio-press-capture-browser.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: authentic-gameplay-stills
          path: audio/press/captures/*.jpg
          retention-days: 7
      - name: Add verified captures to review branch only
        if: steps.inventory.outputs.missing == '1'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/press/captures/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'docs(audio): add authentic WebGL interior and exterior stills'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
