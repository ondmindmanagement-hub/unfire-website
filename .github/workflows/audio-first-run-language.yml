name: Audio first-run language selection QA

on:
  pull_request:
    paths:
      - 'audio/maletin/language-onboarding.js'
      - 'audio/maletin/index.html'
      - 'tests/game-language-*'
      - '.github/workflows/audio-first-run-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locale-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check audio/maletin/language-onboarding.js
      - run: node --check tests/game-language-onboarding-browser.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Browser validation ES/EN
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/unfire-lang-http.log 2>&1 &
          sleep 2
          node tests/game-language-onboarding-browser.cjs
