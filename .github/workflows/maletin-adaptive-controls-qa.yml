name: Maletin adaptive controllers QA
on:
  pull_request:
    paths:
      - "audio/maletin/adaptive-controls.js"
      - "audio/maletin/game-engine-v50.js"
      - "audio/maletin/index.html"
      - "tests/maletin-adaptive-controls.test.cjs"
      - "tests/maletin-adaptive-controls-browser.cjs"
      - ".github/workflows/maletin-adaptive-controls-qa.yml"
  workflow_dispatch:
jobs:
  adaptive-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check audio/maletin/adaptive-controls.js
          node --check audio/maletin/game-engine-v50.js
          node --check tests/maletin-adaptive-controls.test.cjs
      - name: Input, safe placement, and controller mapping
        run: node --test tests/maletin-adaptive-controls.test.cjs
      - name: Door continuity and structure
        run: |
          node --test tests/maletin-door-transition.test.cjs
          node tests/maletin-v50.test.cjs
  adaptive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real DOM phone/tablet layout and drag smoke
        run: node tests/maletin-adaptive-controls-browser.cjs
