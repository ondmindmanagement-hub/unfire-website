name: Audio Online Selector Input Priority
on:
  pull_request:
    paths:
      - 'audio/maletin/garage-scroll-guard.js'
      - 'tests/audio-online-selector-scroll.test.cjs'
      - 'tests/audio-online-selector-native-browser.cjs'
      - '.github/workflows/audio-online-selector-scroll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate selector, garage and trackpad isolation
        run: |
          node --check audio/maletin/garage-scroll-guard.js
          node --check tests/audio-online-selector-native-browser.cjs
          node --test tests/audio-online-selector-scroll.test.cjs tests/audio-garage-scroll-guard.test.cjs tests/audio-trackpad-wheel-isolation.test.cjs

      - name: Install Chromium in CI (never on user's Mac)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate real native scroll in desktop and mobile viewports
        run: node tests/audio-online-selector-native-browser.cjs
