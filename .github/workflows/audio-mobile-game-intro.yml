name: Unfire Games mobile intro quality

on:
  pull_request:
    paths:
      - 'audio/index.html'
      - 'audio/mobile-game-intro.js'
      - 'tests/audio-mobile-game-intro.test.cjs'
      - 'tests/audio-mobile-game-intro-browser.cjs'
      - '.github/workflows/audio-mobile-game-intro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check audio/mobile-game-intro.js
      - run: node --check tests/audio-mobile-game-intro.test.cjs
      - run: node --test tests/audio-mobile-game-intro.test.cjs

  browser:
    name: Mobile intro browser interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/audio-mobile-game-intro-browser.cjs
