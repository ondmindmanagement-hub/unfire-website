name: Audio Vertical Thrust and Dome Approach
on:
  pull_request:
    paths:
      - 'audio/maletin/game-engine-v50.js'
      - 'tests/audio-flight-vertical-dome.test.cjs'
      - '.github/workflows/audio-flight-vertical-dome.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flight-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic vertical flight tests
        run: |
          node --check audio/maletin/game-engine-v50.js
          node --check tests/audio-flight-vertical-dome.test.cjs
          node --test tests/audio-flight-vertical-dome.test.cjs
