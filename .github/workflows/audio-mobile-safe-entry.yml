name: Audio mobile compositor safe entry
on:
  pull_request:
    paths:
      - 'audio/index.html'
      - 'tests/audio-mobile-safe-entry.test.cjs'
      - '.github/workflows/audio-mobile-safe-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor-safe-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate real mobile WebGL opening contract
        run: |
          node --check tests/audio-mobile-safe-entry.test.cjs
          node tests/audio-mobile-safe-entry.test.cjs
