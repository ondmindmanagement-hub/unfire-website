plugins {
    id 'com.android.application'
}

android {
    namespace 'technology.unfire.y2krobots'
    compileSdk 36

    defaultConfig {
        applicationId 'technology.unfire.y2krobots'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Intentionally unsigned: no upload or production signing identity.
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
