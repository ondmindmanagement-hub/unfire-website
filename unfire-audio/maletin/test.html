<style>
@font-face { font-family: 'Michroma'; src: url(fonts/Michroma.ttf); }
@font-face { font-family: 'Orbitron'; src: url(fonts/Orbitron.ttf); font-weight: 400 900; }
@font-face { font-family: 'Share Tech Mono'; src: url(fonts/ShareTechMono.ttf); }
:root { color-scheme:dark } html,body { margin:0; height:100%; background:transparent; overflow:hidden; color:#eef1f5; font:14px/1.4 system-ui,sans-serif }
#cv { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:pan-y }
#cv.dive { touch-action:none }
.hud { position:fixed; left:14px; bottom:14px; display:flex; gap:8px; align-items:center; opacity:0; transition:opacity .4s; pointer-events:none }
.hud.on { opacity:1; pointer-events:auto }
.crumb { font:13px/1 'Share Tech Mono',monospace; letter-spacing:.06em; background:rgba(6,8,12,.78); border:1px solid #353c49; border-radius:999px; padding:9px 14px; white-space:nowrap }
.crumb b { color:#7dffb0; font-weight:400 }
.hud button { width:36px; height:36px; border-radius:50%; border:1px solid #353c49; background:rgba(6,8,12,.78); color:#fff; font:600 16px/1 system-ui; cursor:pointer }
.tip { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); font:12px/1 'Share Tech Mono',monospace; letter-spacing:.08em; text-transform:uppercase; background:rgba(6,8,12,.78); border:1px solid #353c49; border-radius:999px; padding:9px 14px; white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none }
.tip.on { opacity:1 }
.enter { position:fixed; right:14px; bottom:14px; max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:1px solid #ff4fd8; background:rgba(6,8,12,.78); color:#fff; border-radius:999px; padding:10px 14px; font:600 12px/1 'Share Tech Mono',monospace; letter-spacing:.08em; cursor:pointer; opacity:0; transition:opacity .4s; pointer-events:none }
.enter.on { opacity:1; pointer-events:auto }
.tb { position:fixed; left:0; top:0; display:flex; gap:6px; padding:6px; border-radius:16px; background:rgba(8,12,22,.88); border:1px solid #3d8bff66; box-shadow:0 8px 24px #000a, 0 0 18px #3d8bff33; opacity:0; pointer-events:none; transition:opacity .25s; z-index:5 }
.tb.on { opacity:0; pointer-events:none; display:none }
.tb button { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:58px; padding:7px 6px; border-radius:11px; border:1px solid #2c3a5e; background:linear-gradient(180deg,#1d2a4a,#0b1222); color:#fff; font:700 17px/1 system-ui; cursor:pointer }
.tb button small { font:600 8px/1 'Share Tech Mono',monospace; letter-spacing:.08em; color:#9fc8ff }
.tb button.on { border-color:#b6ff3b; box-shadow:0 0 10px #b6ff3b88 }
.tb button.x { background:linear-gradient(180deg,#d3123f,#6e0820); border-color:#ff6f8f }
.tb button.x small { color:#fff }
body::before, body::after { content:''; position:fixed; left:0; right:0; height:0; background:#000; z-index:4; transition:height .6s; pointer-events:none }
body::before { top:0 } body::after { bottom:0 }
body.cine::before, body.cine::after { height:9vh }

    const out = []; let t = start;

      const [n, d] = tok.split(':'); const len = parseFloat(d || '1');

      t += len;
    });
    return out;
