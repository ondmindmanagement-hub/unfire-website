<!doctype html><html lang="en"><head>
<!-- Adaptive loading: low-power mobile/tablet at startup, all devices only for detected stalls. -->
<script id="ufAdaptiveBoot">(function(){
  try {
    var coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
    var memory=Number(navigator.deviceMemory||0), cores=Number(navigator.hardwareConcurrency||0);
    var unknown=!memory&&!cores&&Math.min(innerWidth,innerHeight)<400;
    if(coarse&&((memory>0&&memory<=4)||(cores>0&&cores<=4)||unknown))
      document.documentElement.classList.add('uf-load-pending');
    // A network failure must never leave a permanent overlay.
    setTimeout(function(){document.documentElement.classList.remove('uf-load-pending');},9000);
  } catch(e) {}
})();</script>

    <strong class="uf-load-brand" translate="no">UNFIRE</strong>
    <span class="uf-load-label" id="ufAdaptiveLabel">Preparing the experience…</span>
  </div>
</div>
