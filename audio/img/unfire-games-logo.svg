</g>
<text x="320" y="338" text-anchor="middle" font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="6" fill="url(#chrome)" stroke="#120a2e" stroke-width="3" paint-order="stroke">UNFIRE</text>
