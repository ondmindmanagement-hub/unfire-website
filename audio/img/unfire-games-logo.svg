<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="UNFIRE GAMES">
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#dfe7ff"/><stop offset=".5" stop-color="#7f8fbf"/><stop offset=".58" stop-color="#f3f6ff"/><stop offset=".82" stop-color="#9fe9ff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b6ff"/><stop offset="1" stop-color="#8a6cf0"/></linearGradient>
<linearGradient id="cush" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39f3ff"/><stop offset=".5" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff3fb4"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(320 150)">
<!-- neon cushion -->
<ellipse cx="0" cy="58" rx="150" ry="34" fill="url(#cush)" filter="url(#glow)" opacity=".95"/>
<ellipse cx="0" cy="50" rx="132" ry="22" fill="#1a0b4d" opacity=".55"/>
<!-- lounging round body -->
<path d="M-118 46 C-122 4 -84 -22 -30 -24 C34 -26 104 -14 118 28 C122 44 110 52 92 52 L-100 52 C-112 52 -118 50 -118 46 Z" fill="url(#fur)" stroke="#2a0b6e" stroke-width="5"/>
<!-- tail curled -->
<path d="M110 34 C150 30 160 -4 140 -20 C130 -28 122 -18 132 -10 C144 0 134 20 106 22" fill="none" stroke="#2a0b6e" stroke-width="16" stroke-linecap="round"/>
<path d="M110 34 C150 30 160 -4 140 -20 C130 -28 122 -18 132 -10 C144 0 134 20 106 22" fill="none" stroke="#b9a3ff" stroke-width="9" stroke-linecap="round"/>
<!-- head -->
