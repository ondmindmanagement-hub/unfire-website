<path d="M-50 -18 L-44 -66 L-14 -42 Z" fill="url(#fur)" stroke="#2a0b6e" stroke-width="5" stroke-linejoin="round"/>
<path d="M50 -18 L44 -66 L14 -42 Z" fill="url(#fur)" stroke="#2a0b6e" stroke-width="5" stroke-linejoin="round"/>
<path d="M-40 -26 L-38 -50 L-22 -38 Z" fill="#ff9be0"/><path d="M40 -26 L38 -50 L22 -38 Z" fill="#ff9be0"/>
<ellipse cx="0" cy="0" rx="62" ry="50" fill="url(#fur)" stroke="#2a0b6e" stroke-width="5"/>
<!-- fluffy fringe -->
<path d="M-26 -46 C-18 -60 -6 -52 0 -62 C6 -52 18 -60 26 -46" fill="none" stroke="#2a0b6e" stroke-width="5" stroke-linecap="round"/>
<!-- sleepy happy eyes -->
<path d="M-34 -4 C-26 6 -14 6 -6 -4" fill="none" stroke="#2a0b6e" stroke-width="6" stroke-linecap="round"/>
<path d="M6 -4 C14 6 26 6 34 -4" fill="none" stroke="#2a0b6e" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="-36" cy="14" rx="9" ry="5" fill="#ff7ad9" opacity=".6"/><ellipse cx="36" cy="14" rx="9" ry="5" fill="#ff7ad9" opacity=".6"/>
<path d="M-6 10 L6 10 L0 17 Z" fill="#ff5fb8"/>
<path d="M0 17 C-4 26 -14 26 -16 20 M0 17 C4 26 14 26 16 20" fill="none" stroke="#2a0b6e" stroke-width="4" stroke-linecap="round"/>
<path d="M-44 14 L-72 8 M-44 22 L-72 26 M44 14 L72 8 M44 22 L72 26" stroke="#2a0b6e" stroke-width="3" stroke-linecap="round"/>
<!-- headphones -->
<path d="M-58 -10 C-60 -64 60 -64 58 -10" fill="none" stroke="#39f3ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
<rect x="-74" y="-18" width="22" height="34" rx="9" fill="#0d0830" stroke="#39f3ff" stroke-width="5"/>
<rect x="52" y="-18" width="22" height="34" rx="9" fill="#0d0830" stroke="#39f3ff" stroke-width="5"/>
</g>
<!-- paws -->
<ellipse cx="-20" cy="46" rx="22" ry="12" fill="#d6c8ff" stroke="#2a0b6e" stroke-width="4"/>
<ellipse cx="30" cy="46" rx="22" ry="12" fill="#d6c8ff" stroke="#2a0b6e" stroke-width="4"/>
<!-- zzz -->
<text x="20" y="-74" font-family="Orbitron, Arial Black, Arial" font-weight="900" font-size="26" fill="#bff8ff" opacity=".9">z</text>
<text x="40" y="-96" font-family="Orbitron, Arial Black, Arial" font-weight="900" font-size="20" fill="#bff8ff" opacity=".7">z</text>
</g>
<text x="320" y="300" text-anchor="middle" font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="6" fill="url(#chrome)" stroke="#2a0b6e" stroke-width="2.5" paint-order="stroke">UNFIRE</text>
<text x="320" y="352" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="18" fill="#bff8ff">GAMES</text>
</svg>
