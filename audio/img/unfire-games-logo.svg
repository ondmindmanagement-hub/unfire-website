<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="UNFIRE GAMES">
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#dfe7ff"/><stop offset=".5" stop-color="#7f8fbf"/><stop offset=".58" stop-color="#f3f6ff"/><stop offset=".82" stop-color="#9fe9ff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b1"/><feGaussianBlur stdDeviation="12" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<!-- soft aura -->
<ellipse cx="320" cy="170" rx="150" ry="160" fill="#bff8ff" opacity=".28" filter="url(#halo)"/><ellipse cx="320" cy="200" rx="60" ry="120" fill="#ffffff" opacity=".35" filter="url(#halo)"/>
<!-- arcane circle conjured above the hands -->
<g transform="translate(320 64)" fill="none" stroke="#ffffff" filter="url(#glow)">
<circle r="46" stroke-width="3"/>
<circle r="36" stroke-width="1.5" stroke-dasharray="4 5"/>
<g stroke-width="2.5"><path d="M0 -46 L0 -36 M0 46 L0 36 M-46 0 L-36 0 M46 0 L36 0 M-32 -32 L-26 -26 M32 32 L26 26 M-32 32 L-26 26 M32 -32 L26 -26"/></g>
<circle r="22" stroke-width="2"/><path d="M-22 0 A22 22 0 0 1 22 0" stroke-width="2" stroke-dasharray="2 4"/>
<circle r="7" fill="#ffffff"/>
</g>
<!-- hooded high mage silhouette, white -->
<g fill="#ffffff" filter="url(#glow)">
<!-- hood + head -->
<path d="M320 104 C302 104 290 118 290 136 C290 150 296 160 304 168 L336 168 C344 160 350 150 350 136 C350 118 338 104 320 104 Z"/>
<!-- shoulders and robe falling to the ground -->
<path d="M300 164 C286 170 276 182 272 196 L258 300 C256 312 264 318 276 318 L364 318 C376 318 384 312 382 300 L368 196 C364 182 354 170 340 164 Z"/>
<!-- left arm raised, palm open toward the sigil -->
<path d="M282 182 C268 168 258 146 262 126 C264 116 272 112 278 118 L284 124 C282 140 290 160 302 172 Z"/>
<path d="M262 126 C258 114 262 104 270 102 C276 101 280 106 278 114 L276 122 Z"/>
<!-- right arm raised -->
<path d="M358 182 C372 168 382 146 378 126 C376 116 368 112 362 118 L356 124 C358 140 350 160 338 172 Z"/>
<path d="M378 126 C382 114 378 104 370 102 C364 101 360 106 362 114 L364 122 Z"/>
<!-- flowing robe hem tails -->
<path d="M258 300 C240 310 230 318 220 318 L276 318 Z" opacity=".85"/>
<path d="M382 300 C400 310 410 318 420 318 L364 318 Z" opacity=".85"/>
</g>
<!-- energy streams from palms to the circle -->
<g stroke="#bff8ff" stroke-width="2" fill="none" filter="url(#glow)" opacity=".9">
<path d="M272 104 C280 90 290 84 300 80"/><path d="M368 104 C360 90 350 84 340 80"/>
</g>
<text x="320" y="370" text-anchor="middle" font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="66" letter-spacing="6" fill="url(#chrome)" stroke="#120a2e" stroke-width="3" paint-order="stroke">UNFIRE</text>
<text x="320" y="410" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="18" fill="#bff8ff">GAMES</text>
</svg>
