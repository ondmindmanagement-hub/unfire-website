<radialGradient id="noseV" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ff9aac"/><stop offset="1" stop-color="#d9405e"/></radialGradient>
<radialGradient id="spec" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
